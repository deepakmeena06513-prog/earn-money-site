<!DOCTYPE html>
<html>
<head>
<title>Tiger vs Dragon</title>

<style>
body{
  font-family: Arial;
  text-align: center;
  background: linear-gradient(to right, purple, red);
  color:white;
}

.box{
  background:white;
  color:black;
  width:260px;
  margin:auto;
  padding:20px;
  border-radius:10px;
}

button{
  width:100%;
  padding:10px;
  margin:5px;
  border:none;
  border-radius:5px;
  font-size:16px;
}

input{
  width:100%;
  padding:8px;
  margin:5px;
}

.tiger{background:orange;}
.dragon{background:green;color:white;}
.start{background:blue;color:white;}
.add{background:purple;color:white;}
.withdraw{background:red;color:white;}
.logout{background:black;color:white;}
</style>

</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h3>Login</h3>
  <input type="text" id="username" placeholder="Enter name"><br>
  <button onclick="login()">Login</button>
</div>

<p id="welcome"></p>

<h2>🐯 Tiger vs 🐉 Dragon</h2>

<div class="box">

<h3>Balance: ₹<span id="balance">100</span></h3>

<input type="number" id="bet" placeholder="Enter Bet ₹">

<button class="tiger" onclick="select('tiger')">🐯 Tiger</button>
<button class="dragon" onclick="select('dragon')">🐉 Dragon</button>

<button class="start" onclick="startGame()">▶ Start Game</button>

<button class="add" onclick="addMoney()">💰 Add Money</button>
<button class="withdraw" onclick="withdraw()">💸 Withdraw</button>
<button class="logout" onclick="logout()">🚪 Logout</button>

<p id="status">Game Ready</p>

<p id="history"></p>

</div>

<script>

let user = "";
let balance = 100;
let selected = "";
let history = "";

// LOGIN
function login(){
  let name = document.getElementById("username").value;

  if(name == ""){
    alert("Name dalna zaruri hai");
    return;
  }

  localStorage.setItem("user", name);
  user = name;

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("welcome").innerText = "Welcome " + user;

  loadBalance();
}

// PAGE LOAD
window.onload = function(){
  let savedUser = localStorage.getItem("user");

  if(savedUser){
    user = savedUser;
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("welcome").innerText = "Welcome " + user;

    loadBalance();
  }
}

// LOAD BALANCE
function loadBalance(){
  let savedBalance = localStorage.getItem(user+"_balance");

  if(savedBalance == null){
    balance = 100;
  } else {
    balance = parseInt(savedBalance);
  }

  document.getElementById("balance").innerText = balance;
}

// SELECT
function select(choice){
  selected = choice;
  alert("Selected: " + choice);
}

// GAME
function startGame(){

  let bet = parseInt(document.getElementById("bet").value);

  if(!bet || bet <= 0){
    alert("Bet dalo");
    return;
  }

  if(selected == ""){
    alert("Pehle select karo");
    return;
  }

  if(balance < bet){
    alert("Balance kam hai");
    return;
  }

  balance -= bet;
  document.getElementById("balance").innerText = balance;

  let time = 5;

  let timer = setInterval(function(){

    document.getElementById("status").innerText = "Time: " + time;

    time--;

    if(time < 0){
      clearInterval(timer);

      let result = Math.random() < 0.5 ? "tiger" : "dragon";

      if(selected == result){
        balance += bet * 2;
        alert("🎉 You Win");
      } else {
        alert("😢 You Lose");
      }

      localStorage.setItem(user+"_balance", balance);

      document.getElementById("balance").innerText = balance;
      document.getElementById("status").innerText = "Result: " + result;

      history += result + " | ";
      document.getElementById("history").innerText = "History: " + history;

      selected = "";
    }

  },1000);
}

// ADD MONEY
function addMoney(){
  let amount = prompt("Kitna paisa add karna hai?");
  if(!amount) return;

  amount = parseInt(amount);

  balance += amount;

  localStorage.setItem(user+"_balance", balance);
  document.getElementById("balance").innerText = balance;
}

// WITHDRAW
function withdraw(){
  let amount = prompt("Kitna nikalna hai?");
  if(!amount) return;

  amount = parseInt(amount);

  if(amount > balance){
    alert("Balance kam hai");
    return;
  }

  balance -= amount;

  localStorage.setItem(user+"_balance", balance);
  document.getElementById("balance").innerText = balance;

  alert("Withdraw request sent ✅");
}

// LOGOUT
function logout(){
  localStorage.removeItem("user");
  location.reload();
}

</script>

</body>
</html>
