<!DOCTYPE html>
<html>
<head>
  <title>Tiger Dragon Game</title>
  <style>
    body{
      margin:0;
      font-family: Arial;
      background: linear-gradient(to right, red, purple);
      color:white;
      text-align:center;
    }
    .box{
      margin-top:50px;
    }
    input{
      padding:10px;
      width:80%;
      margin:10px;
    }
    button{
      padding:12px;
      width:80%;
      margin:10px;
      border:none;
      color:white;
      font-size:16px;
    }
    .btn{background:blue;}
  </style>
</head>

<body>

<div id="login" class="box">
  <h2>Login</h2>
  <input type="text" id="name" placeholder="Enter Name">
  <br>
  <button class="btn" onclick="login()">Login</button>
</div>

<div id="game" class="box" style="display:none;">
  <h2>🐯 Tiger vs 🐲 Dragon</h2>
  <h3>Coins: <span id="coins">100</span></h3>

  <button onclick="play('tiger')">Tiger</button>
  <button onclick="play('dragon')">Dragon</button>

  <h3 id="result"></h3>
</div>

<script>
let user="";
let coins=100;

function login(){
  user = document.getElementById("name").value;
  if(user==""){
    alert("Enter name");
    return;
  }

  document.getElementById("login").style.display="none";
  document.getElementById("game").style.display="block";
}

function play(choice){
  let random = Math.random()<0.5 ? "tiger":"dragon";

  if(choice==random){
    coins += 10;
    document.getElementById("result").innerText="You Win 🎉";
  }else{
    coins -= 10;
    document.getElementById("result").innerText="You Lose 😢";
  }

  document.getElementById("coins").innerText=coins;
}
</script>

</body>
</html>
