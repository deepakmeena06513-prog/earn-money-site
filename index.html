<!DOCTYPE html>
<html>
<head>
<title>Contest App</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: linear-gradient(to right, #4facfe, #00f2fe);
}
.card {
  background: white;
  padding: 20px;
  margin: 50px auto;
  width: 300px;
  border-radius: 15px;
}
button {
  width: 90%;
  padding: 10px;
  margin: 10px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}
.join { background: green; color: white; }
.play { background: orange; }
.withdraw { background: gray; color: white; }
</style>
</head>

<body>

<h2>🏆 Contest App</h2>

<div class="card">
<h3>Balance: ₹ <span id="balance">100</span></h3>

<button class="join" onclick="joinContest()">Join Contest ₹10</button>
<button class="play" onclick="playGame()">Play Quiz</button>
<button class="withdraw" onclick="withdraw()">Withdraw</button>
</div>

<script>
let balance = localStorage.getItem("balance");
if(balance == null) balance = 100;
document.getElementById("balance").innerText = balance;

function joinContest() {
  if(balance < 10){
    alert("Not enough balance");
  } else {
    balance = parseInt(balance) - 10;
    localStorage.setItem("balance", balance);
    document.getElementById("balance").innerText = balance;
    alert("Joined Contest!");
  }
}

function playGame() {
  let answer = prompt("2 + 2 = ?");
  if(answer == "4"){
    balance = parseInt(balance) + 20;
    alert("You Won ₹20 🎉");
  } else {
    alert("Wrong Answer ❌");
  }
  localStorage.setItem("balance", balance);
  document.getElementById("balance").innerText = balance;
}

function withdraw() {
  if(balance < 50){
    alert("Minimum ₹50 required");
  } else {
    alert("Withdraw Request Sent 💰");
  }
}
</script>

</body>
</html>
