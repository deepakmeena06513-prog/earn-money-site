<!DOCTYPE html>
<html>
<head>
<title>Tiger Dragon Game</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:black;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  width:90%;
  max-width:400px;
  text-align:center;
}

h2{
  font-size:26px;
}

h3{
  font-size:22px;
}

button{
  width:100%;
  padding:18px;
  margin:10px 0;
  font-size:20px;
  border:none;
  border-radius:10px;
}

.tiger{
  background:orange;
  color:white;
}

.dragon{
  background:green;
  color:white;
}
</style>
</head>

<body>

<div class="box">
  <h2>🔥 Tiger Dragon Game</h2>
  <h3 id="coins">Coins: 100</h3>

  <button class="tiger" onclick="play('tiger')">🐯 Tiger</button>
  <button class="dragon" onclick="play('dragon')">🐲 Dragon</button>

  <h3 id="result"></h3>
</div>

<script>
let coins=100;

function play(choice){
  let random = Math.random()<0.5 ? "tiger":"dragon";

  if(choice==random){
    coins+=10;
    document.getElementById("result").innerHTML="<span style='color:lime'>Win 🎉</span>";
  }else{
    coins-=10;
    document.getElementById("result").innerHTML="<span style='color:red'>Lose 😢</span>";
  }

  document.getElementById("coins").innerText="Coins: "+coins;
}
</script>

</body>
</html>
