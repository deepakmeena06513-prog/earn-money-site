<!DOCTYPE html>
<html>
<head>
<title>Tiger vs Dragon</title>

<style>
body{
  font-family: Arial;
  text-align:center;
  background: linear-gradient(to right, purple, red);
  color:white;
}

.box{
  background:white;
  color:black;
  width:280px;
  margin:auto;
  padding:20px;
  border-radius:10px;
}

button{
  width:100%;
  padding:10px;
  margin:5px;
  border:none;
  border-radius:5px;
  font-size:16px;
}

.tiger{background:orange;}
.dragon{background:green;color:white;}
.start{background:blue;color:white;}
.ad{background:purple;color:white;}
.logout{background:black;color:white;}
</style>
</head>

<body>

<h3 id="welcome"></h3>

<h2>🐯 Tiger vs 🐉 Dragon</h2>

<div id="loginBox">
  <h3>Login</h3>
  <input type="text" id="username" placeholder="Enter name"><br><br>
  <button onclick="login()">Login</button>
</div>

<div class="box" id="gameBox" style="display:none;">

<h3>Coins: 🪙 <span id="balance">100</span></h3>

<input type="number" id="bet" placeholder="Enter Bet Coins"><br><br>

<button class="tiger" onclick="select('tiger')">🐯 Tiger</button>
<button class="dragon" onclick="select('dragon')">🐉 Dragon</button>

<button class="start" onclick="startGame()">▶ Start Game</button>

<button class="ad" onclick="earnCoins()">🎥 Watch Ad → +20 Coins</button>

<button class="logout" onclick="logout()">🚪 Logout</button>

<p id="status">Game Ready</p>

</div>

<script>

let user = "";
let balance = 100;
let selected = "";

// LOGIN
function login(){
  let name = document.getElementById("username").value;

  if(name == ""){
    alert("Name dalna zaruri hai");
    return;
  }

  user = name;
  localStorage.setItem("user", user);

  document.getElementById("loginBox").style.display="none";
  document.getElementById("gameBox").style.display="block";
  document.getElementById("welcome").innerText="Welcome " + user;

  loadBalance();
}

// LOAD BALANCE
function loadBalance(){
  if(localStorage.getItem(user+"_balance")){
    balance = parseInt(localStorage.getItem(user+"_balance"));
  }
  document.getElementById("balance").innerText = balance;
}

// SELECT
function select(choice){
  selected = choice;
  alert("Selected: " + choice);
}

// START GAME
function startGame(){

  let bet = parseInt(document.getElementById("bet").value);

  if(selected == ""){
    alert("Pehle select karo");
    return;
  }

  if(isNaN(bet) || bet <= 0){
    alert("Bet dalna zaruri hai");
    return;
  }

  if(balance < bet){
    alert("Coins kam hai");
    return;
  }

  balance -= bet;

  let result = Math.random() < 0.5 ? "tiger" : "dragon";

  if(selected == result){
    balance += bet * 2;
    alert("🎉 You Win");
  } else {
    alert("😢 You Lose");
  }

  localStorage.setItem(user+"_balance", balance);

  document.getElementById("balance").innerText = balance;
  document.getElementById("status").innerText = "Result: " + result;

  selected = "";
}

// EARN COINS (AD)
function earnCoins(){
  alert("🎥 Ad dekhne par +20 Coins mile");
  balance += 20;
  localStorage.setItem(user+"_balance", balance);
  document.getElementById("balance").innerText = balance;
}

// LOGOUT
function logout(){
  localStorage.removeItem("user");
  location.reload();
}

// AUTO LOGIN
window.onload = function(){
  let savedUser = localStorage.getItem("user");

  if(savedUser){
    user = savedUser;
    document.getElementById("loginBox").style.display="none";
    document.getElementById("gameBox").style.display="block";
    document.getElementById("welcome").innerText="Welcome " + user;
    loadBalance();
  }
}

</script>

</body>
</html>
