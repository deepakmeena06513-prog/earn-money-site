<!DOCTYPE html>
<html>
<body style="
background:black;
color:white;
text-align:center;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
">

<h2>🔥 Tiger Dragon Game</h2>

<h3 id="coins">Coins: 100</h3>
<br><br>

<button onclick="play('tiger')">Tiger</button>
<button onclick="play('dragon')">Dragon</button>

<h3 id="result"></h3>

<script>
let coins=100;

function play(choice){
  let random = Math.random()<0.5 ? "tiger":"dragon";

  if(choice==random){
    coins+=10;
    document.getElementById("result").innerText="Win 🎉";
  }else{
    coins-=10;
    document.getElementById("result").innerText="Lose 😢";
  }

  document.getElementById("coins").innerText="Coins: "+coins;
}
</script>

</body>
</html>
