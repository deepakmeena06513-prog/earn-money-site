<!DOCTYPE html>
<html>
<head>
  <title>Tiger vs Dragon</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: linear-gradient(to right, purple, red);
      color: white;
    }
    .box {
      background: white;
      color: black;
      padding: 20px;
      border-radius: 15px;
      width: 250px;
      margin: 50px auto;
    }
    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .tiger { background: orange; color: white; }
    .dragon { background: green; color: white; }
  </style>
</head>

<body>

<h2>🐯 Tiger vs 🐉 Dragon</h2>

<div class="box">
  <h3>Balance: ₹ <span id="balance">100</span></h3>

  <button class="tiger" onclick="play('tiger')">🐯 Tiger</button>
  <button class="dragon" onclick="play('dragon')">🐉 Dragon</button>
</div>

<script>

let user = "demo"; // simple user
let balance = localStorage.getItem(user+"_balance");

if(balance == null){
  balance = 100;
  localStorage.setItem(user+"_balance", balance);
}

balance = parseInt(balance);
document.getElementById("balance").innerText = balance;

function play(choice){

  let result = Math.random() < 0.5 ? "tiger" : "dragon";

  if(choice === result){
    balance += 20;
    alert("🎉 You Win");
  } else {
    balance -= 10;
    alert("😢 You Lose");
  }

  localStorage.setItem(user+"_balance", balance);
  document.getElementById("balance").innerText = balance;
}

</script>

</body>
</html>
